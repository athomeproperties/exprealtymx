<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Team Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --teal:#0b3d3a; --sand:#fdfaf5; --gold:#c9a961; --gray:#666; --border:#e2ddd3; }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'DM Sans', sans-serif; background:var(--sand); color:var(--teal);
        min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  h1,h2{ font-family:'Cormorant Garamond', serif; font-weight:700; margin:0 0 8px; }
  .card{ background:#fff; border:1px solid var(--border); border-radius:12px; padding:32px;
         max-width:420px; width:100%; box-shadow:0 4px 20px rgba(11,61,58,0.08); }
  .wide{ max-width:900px; }
  input, select{ width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:8px;
        font-family:'DM Sans', sans-serif; font-size:15px; margin-top:6px; }
  label{ font-size:13px; font-weight:500; color:var(--gray); }
  button{ background:var(--teal); color:var(--sand); border:none; border-radius:8px; padding:12px 20px;
        font-family:'DM Sans', sans-serif; font-weight:700; font-size:15px; cursor:pointer; margin-top:16px; width:100%; }
  button:hover{ opacity:0.9; }
  button.secondary{ background:transparent; color:var(--teal); border:1px solid var(--teal); width:auto;
        padding:8px 14px; font-size:13px; margin-top:0; }
  .error{ color:#b3261e; font-size:13px; margin-top:8px; display:none; }
  .hidden{ display:none !important; }
  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
  table{ width:100%; border-collapse:collapse; margin-top:12px; }
  th,td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); font-size:14px; vertical-align:top; }
  th{ font-size:12px; text-transform:uppercase; letter-spacing:0.04em; color:var(--gray); }
  .stage-pill{ display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; color:var(--teal); white-space:nowrap; }
  .empty{ color:var(--gray); font-size:14px; padding:20px 0; text-align:center; }
  .loading{ color:var(--gray); font-size:14px; }
</style>
</head>
<body>

  <div class="card" id="gate">
    <h1>Team Portal</h1>
    <p style="color:var(--gray); font-size:14px;">Enter the portal password to continue.</p>
    <form id="gateForm">
      <label for="gatePassword">Password</label>
      <input type="password" id="gatePassword" autocomplete="current-password" required>
      <div class="error" id="gateError">Incorrect password.</div>
      <button type="submit">Enter</button>
    </form>
  </div>

  <div class="card hidden" id="ownerPick">
    <h1>Who are you?</h1>
    <p style="color:var(--gray); font-size:14px;">Select your name to see your prospects.</p>
    <label for="ownerSelect">Your name</label>
    <select id="ownerSelect"></select>
    <button id="viewBtn">View my prospects</button>
  </div>

  <div class="card wide hidden" id="dashboard">
    <div class="toolbar">
      <div>
        <h2 id="dashTitle">Prospects</h2>
        <p style="color:var(--gray); font-size:13px; margin:0;">Updated live from the team tracker</p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="secondary" id="switchBtn">Switch name</button>
        <button class="secondary" id="logoutBtn">Log out</button>
      </div>
    </div>
    <div style="margin-bottom:16px;">
      <label for="stageFilter">Filter by stage</label>
      <select id="stageFilter">
        <option value="">All Stages</option>
      </select>
    </div>
    <div id="tableWrap"><p class="loading">Loading...</p></div>
  </div>

<script>
/* ===================== CONFIG — edit these ===================== */
const PORTAL_PASSWORD = "canmex2026";               // shared password — CHANGE THIS
const JSONBIN_BIN_ID = "6a7f79cbda38895dfee61223";
const JSONBIN_KEY = "$2a$10$aBf8XbTryUhixbcSSdD5JOmW3rBdACUhwMTEgSUgPA0K0Rfzv3izG";
/* ================================================================= */

const STAGE_COLORS = {
  "New Prospect":      "#d9d9d9",
  "Collab Scheduled":  "#bdd7ee",
  "Collab Completed":  "#9dc3e6",
  "R1 Scheduled":      "#ffe699",
  "R1 Completed":      "#ffd966",
  "R2 Scheduled":      "#f8cbad",
  "R2 Completed":      "#f4b183",
  "Closed Won":         "#a9d18e",
  "Closed Lost":        "#f4a6a6"
};

let allRecords = [];
let currentRecords = [];

const gate = document.getElementById('gate');
const ownerPick = document.getElementById('ownerPick');
const dashboard = document.getElementById('dashboard');
const ownerSelect = document.getElementById('ownerSelect');

function showScreen(el){
  [gate, ownerPick, dashboard].forEach(s => s.classList.add('hidden'));
  el.classList.remove('hidden');
}

document.getElementById('gateForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const val = document.getElementById('gatePassword').value;
  if (val === PORTAL_PASSWORD) {
    sessionStorage.setItem('portalAuth', 'true');
    document.getElementById('gateError').style.display = 'none';
    await loadOwners();
    const savedOwner = sessionStorage.getItem('portalOwner');
    if (savedOwner) { ownerSelect.value = savedOwner; loadDashboard(savedOwner); }
    else { showScreen(ownerPick); }
  } else {
    document.getElementById('gateError').style.display = 'block';
  }
});

document.getElementById('viewBtn').addEventListener('click', function(){
  const owner = ownerSelect.value;
  sessionStorage.setItem('portalOwner', owner);
  loadDashboard(owner);
});

document.getElementById('switchBtn').addEventListener('click', function(){
  sessionStorage.removeItem('portalOwner');
  showScreen(ownerPick);
});

document.getElementById('logoutBtn').addEventListener('click', function(){
  sessionStorage.removeItem('portalAuth');
  sessionStorage.removeItem('portalOwner');
  document.getElementById('gatePassword').value = '';
  showScreen(gate);
});

document.getElementById('stageFilter').addEventListener('change', function(){
  const val = this.value;
  const filtered = val ? currentRecords.filter(r => r.stage === val) : currentRecords;
  renderTable(filtered);
});

async function loadOwners(){
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    const data = await res.json();
    allRecords = data.record.records || [];
    const owners = data.record.owners || [];
    ownerSelect.innerHTML = '';
    owners.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      ownerSelect.appendChild(opt);
    });
    const stageSel = document.getElementById('stageFilter');
    stageSel.innerHTML = '<option value="">All Stages</option>';
    Object.keys(STAGE_COLORS).forEach(stage => {
      const opt = document.createElement('option');
      opt.value = stage; opt.textContent = stage;
      stageSel.appendChild(opt);
    });
  } catch (err) {
    console.error(err);
  }
}

// Restore session
if (sessionStorage.getItem('portalAuth') === 'true') {
  loadOwners().then(() => {
    const savedOwner = sessionStorage.getItem('portalOwner');
    if (savedOwner) { ownerSelect.value = savedOwner; loadDashboard(savedOwner); }
    else { showScreen(ownerPick); }
  });
}

async function loadDashboard(owner){
  showScreen(dashboard);
  document.getElementById('dashTitle').textContent = owner + "'s Prospects";
  const wrap = document.getElementById('tableWrap');
  wrap.innerHTML = '<p class="loading">Loading...</p>';
  document.getElementById('stageFilter').value = '';
  currentRecords = allRecords.filter(r => r.owner === owner);
  renderTable(currentRecords);
}

function renderTable(records){
  const wrap = document.getElementById('tableWrap');
  if (!records.length) { wrap.innerHTML = '<p class="empty">No prospects yet.</p>'; return; }
  records = records.slice().sort((a,b) => (b.lastUpdated || '').localeCompare(a.lastUpdated || ''));
  let html = '<table><thead><tr><th>Prospect</th><th>Setter</th><th>Stage</th><th>Zoom Date</th><th>Next Step</th><th>Notes</th><th>Updated</th></tr></thead><tbody>';
  records.forEach(r => {
    const color = STAGE_COLORS[r.stage] || '#eee';
    html += `<tr>
      <td><strong>${escapeHtml(r.prospectName || '')}</strong><br><span style="color:var(--gray); font-size:12px;">${escapeHtml(r.phone || '')}${r.email ? ' · ' + escapeHtml(r.email) : ''}</span></td>
      <td>${escapeHtml(r.setter || '—')}</td>
      <td><span class="stage-pill" style="background:${color};">${escapeHtml(r.stage || '')}</span></td>
      <td>${escapeHtml(r.zoomDate || '')}</td>
      <td>${escapeHtml(r.nextStep || '')}</td>
      <td>${escapeHtml(r.notes || '')}</td>
      <td>${escapeHtml(r.lastUpdated || '')}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
</script>
</body>
</html>
