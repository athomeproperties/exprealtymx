async function doRestore() {
  const statusEl = document.getElementById('status');
  const logEl = document.getElementById('log');
  statusEl.className = 'status loading';
  statusEl.innerHTML = '<strong>Restoring ' + LISTINGS.length + ' properties...</strong>';
  logEl.innerHTML = '';

  try {
    const r = await fetch(BIN_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': BIN_KEY
      },
      body: JSON.stringify(LISTINGS)
    });

    if (!r.ok) {
      throw new Error('HTTP ' + r.status);
    }

    const data = await r.json();
    statusEl.className = 'status success';
    statusEl.innerHTML = '<strong>✓ Success!</strong> ' + LISTINGS.length + ' properties restored to JSONBin.<br><br>' +
      'Your website should now show all properties. <a href="https://www.exprealtymx.com">Check it now →</a><br><br>' +

      '<li>Update any prices marked as "Price on request"</li>' +

      '</ul>';

    logEl.innerHTML = '<pre>' + LISTINGS.map(p => '✓ ' + p.title + ' (' + p.area + ')').join('\n') + '</pre>';
  } catch(e) {
    statusEl.className = 'status error';
    statusEl.innerHTML = '<strong>Error:</strong> ' + e.message + '<br>Check your internet connection and try again.';
